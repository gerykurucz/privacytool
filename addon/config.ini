[communication]
# winapi | interception_driver | serial | socket
type = interception_driver
microcontroller_ip = 192.168.1.100
microcontroller_port = 50256
# Serial port number (3 means COM3) or full name (COM3)
com_port = 3

[focus]
screen_center_offset = 0
focus_smoothing_factor = 0.5
speed = 1.0
y_speed_multiplier = 1.0
focus_height = 0.5

[screen]
group_close_target_blobs_threshold = 3, 3
# HSV color range of the target (used in center capture mode)
lower_color = 0, 120, 70
upper_color = 10, 255, 255
capture_area_x = 320
capture_area_y = 320
focus_area_x = 100
focus_area_y = 80
max_loops_per_sec = 60
auto_detect_resolution = true
resolution_x = 1920
resolution_y = 1080
# center = watch a fixed square at the screen center (classic behaviour)
# cursor = anchor the search square on the mouse pointer (clamped to screen)
capture_mode = center
# Human colour names or r,g,b triples, ';' separated (cursor mode only).
# Empty keeps the legacy lower_color/upper_color HSV band above.
# e.g. accent_color = red; blue   or   accent_color = 255,0,0
accent_color =
color_tolerance = 40

[tracking]
# Target persistence: keep locked on the same item instead of flipping
# between similar blobs when it blinks or is briefly occluded.
follow_enabled = false
follow_seconds = 20
# Ignore blobs smaller than this many pixels (0 = off)
min_target_area = 0
# Motion lead: aim where a moving item will be (needs capture_mode = cursor)
motion_lead = false
motion_lead_ms = 40
motion_max_lead_px = 30

[help]
# move | offset
mode = offset
help_x = 0.0
help_y = 30.0
max_offset = 100
recover = 60.0

[click]
click_delay = 60
click_randomization = 40
click_threshold = 4

[rapid_click]
target_cps = 10

[key_binds]
# Hex virtual-key codes (e.g. 01 = left mouse, 02 = right mouse, 10 = SHIFT, 52 = R)
key_reload_config = 72
key_toggle_focus = 46
key_toggle_help = 4D
key_exit = 23
key_click = 01
key_rapid_click = 02
# Comma-separated hex codes, or 'off' to disable hold-to-focus
focus_keys = off

[debug]
enabled = false
always_on = false
# game | mask
display_mode = game
debug_fullscreen_capture = false
